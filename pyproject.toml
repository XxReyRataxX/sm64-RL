[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gymnasium_env"]

[project]
name = "gymnasium_env"
version = "0.0.1"
dependencies = [
  "gymnasium",
  "pygame>=2.1.3",
  "pre-commit",
  # IPC con el juego: shm POSIX + semaforos (gymnasium_env/envs/sm64_connection.py)
  "posix-ipc>=1.1; sys_platform != 'win32'",
  # RL: stable-baselines3 trae PyTorch como dependencia (PPO, DQN, etc.)
  "stable-baselines3>=2.3.0",
  "torch>=2.0",
]
